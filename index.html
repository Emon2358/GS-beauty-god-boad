<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GS音源対応 MIDI Webプレイヤー</title>
  <!-- Tone.js も一部で使えるように残す -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.39/build/Tone.min.js" defer></script>
  <script src="https://www.midijs.net/lib/midi.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.5/build/MIDIPlayer.min.js" defer></script>
  <!-- 正しいSyriMusic読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/syri-music@0.2.2/dist/syri-music.min.js" defer></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    input, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>GS音源対応 MIDI Webプレイヤー</h1>

  <input type="file" id="midiFileInput" accept=".mid,.midi">
  <br>
  <button id="playButton">▶ SyriMusicで再生</button>
  <button onclick="stopPlayback()">⏹ 停止</button>

  <script>
    let syriPlayer;

    function stopPlayback() {
      if (syriPlayer) syriPlayer.stop();
      if (typeof MIDI !== 'undefined') MIDI.stopAllNotes();
    }

    // AudioContextをユーザー操作後に開始
    document.getElementById('playButton').addEventListener('click', async () => {
      const file = document.getElementById('midiFileInput').files[0];
      if (!file) return alert("MIDIファイルを選択してください");

      // AudioContextのresume（ブラウザ制限対策）
      if (Tone && Tone.context && Tone.context.state !== 'running') {
        await Tone.start();
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        syriPlayer = new window.Syri.Player({
          useReverb: true,
          useChorus: true,
          enableSysEx: true,
          enableGS: true,
          gain: 1.0,
          masterTuning: 440.0
        });

        await syriPlayer.load(e.target.result);
        syriPlayer.play();
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
